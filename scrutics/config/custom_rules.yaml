# Scrutics — Custom Rules and Output Configuration
# ──────────────────────────────────────────────────
# This file is yours to edit. It ships with Scrutics and is always active.
#
# Scrutics also checks ~/.scrutics/scrutics.yaml for a machine-wide override.
# Custom rules here always take precedence over built-in rules.
# If a custom rule matches the same port as a built-in, yours wins.
#
# Reload at runtime: edit and save this file while Scrutics is running.
# The file watcher reloads valid changes automatically within 2-3 seconds.
# Press R in the TUI for an immediate manual reload.
# On Linux, SIGHUP is also available for headless workflows.


# ── Classification rules ──────────────────────────────────────────────────────
# Each rule classifies a device by port, MAC prefix, or both.
# Behavioral constraint fields are optional — add them to any rule to define
# what that device is allowed to do. Violations fire immediately as
# BEHAVIORAL_VIOLATION anomalies (severity HIGH), independent of the baseline.
#
# Required fields:
#   name        : Human-readable label
#   classify_as : Protocol label shown in output
#   role        : Device role shown in output
#   is_ot       : true or false
#
# Optional classification fields:
#   port        : Destination port to match
#   protocol    : TCP or UDP (defaults to either)
#   mac_prefix  : First 3 bytes of MAC e.g. "00:80:F4"
#   confidence  : HIGH / MEDIUM / LOW (defaults to HIGH)
#
# Optional behavioral constraint fields:
#   never_initiates       : true — alert if device ever initiates a connection
#   allowed_peers         : list of IPs — alert if device talks to any other IP
#   allowed_ports         : list of ports — alert if traffic seen on any other port
#   alert_on_new_port     : true — alert first time each new port is observed
#   max_new_peers_per_hour: N — alert if device exceeds N new peers in 60 minutes
#
# ── Examples ─────────────────────────────────────────────────────────────────
#
# rules:
#   # Minimal rule — classification only
#   - name: "OSIsoft PI Historian"
#     port: 5461
#     classify_as: "PI Historian"
#     role: "Data Historian"
#     is_ot: true
#
#   # Rule with behavioral constraints
#   - name: "Modbus PLC Fleet"
#     port: 502
#     classify_as: "Modbus TCP"
#     role: "PLC / RTU"
#     is_ot: true
#     never_initiates: true        # PLCs respond to polling, never initiate
#     allowed_peers:
#       - "192.168.1.100"          # SCADA server
#       - "192.168.1.101"          # Engineering workstation
#     max_new_peers_per_hour: 2
#
#   # MAC prefix match — useful for vendor-specific devices without fixed ports
#   - name: "Legacy RTU Fleet"
#     mac_prefix: "00:AB:CD"
#     classify_as: "Legacy RTU"
#     role: "Remote Terminal Unit"
#     is_ot: true
#     confidence: MEDIUM
#     alert_on_new_port: true

rules: [] # Leave empty if you do not need custom rules, or replace [] with rules in the format shown above.

# ── Inventory scope ───────────────────────────────────────────────────────────
# By default Scrutics tracks RFC1918 private IPs as assets and treats public
# internet addresses as peers only. Set include_public_ips: true only if your
# OT network uses public/routed address space internally.
#
# Use cidrs to restrict discovery to specific subnets:
#
# inventory:
#   include_public_ips: false
#   cidrs:
#     - "192.168.88.0/24"
#     - "10.10.0.0/16"

inventory:
  include_public_ips: false
  cidrs: [] # Leave empty to monitor all private ranges, or replace [] with the CIDR ranges you want to monitor.


# ── Output sinks ─────────────────────────────────────────────────────────────
# Forward anomaly events to a SIEM in real time. Multiple sinks can be active
# simultaneously. A slow or unreachable SIEM never stalls packet capture —
# delivery runs in a background queue.
#
# Supported sink types:
#   syslog     — UDP or TCP syslog; formats: json (default), cef, leef, plain
#   splunk_hec — Splunk HTTP Event Collector (HTTP/HTTPS)
#
# ── Wazuh / Graylog / Elastic (JSON syslog) ──────────────────────────────────
#
# output:
#   sinks:
#     - type: syslog
#       host: 192.168.1.50
#       port: 514
#       protocol: udp
#       format: json
#
# ── Splunk HEC ────────────────────────────────────────────────────────────────
#
#     - type: splunk_hec
#       url: https://splunk.example.com:8088
#       token: your-hec-token-here
#       verify_ssl: true
#       index: scrutics           # optional
#
# ── ArcSight (CEF) / QRadar (LEEF) ──────────────────────────────────────────
#
#     - type: syslog
#       host: 192.168.1.20
#       port: 514
#       protocol: udp
#       format: cef               # or leef for QRadar

output:
  sinks: [] # Leave empty to disable SIEM forwarding, or replace [] with a sink configuration shown above.
