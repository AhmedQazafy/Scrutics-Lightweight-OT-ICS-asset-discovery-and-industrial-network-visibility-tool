# Scrutics Curated OUI Metadata
# Maps normalized MAC OUI prefixes (MA-L: 6 hex, MA-M: 7 hex, MA-S: 9 hex)
# to device family hints.
#
# INVARIANT: Device family hints are supporting identification evidence (os_hint).
# They NEVER independently establish or overwrite classification_type.
#
# An entry is added only when the prefix is registered to the vendor in the IEEE registry and the
# hint has a cited source (vendor documentation or a public reference), for example:
#
#   "001B1B":
#     device_family_hint: "..."
#     source: "<vendor document or public reference>"
#
# No bundled entry currently meets that rule. A user file at ~/.scrutics/curated_oui.yaml adds or
# overrides entries per prefix.

{}
